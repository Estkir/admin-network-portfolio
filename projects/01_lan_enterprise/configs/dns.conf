# DNS interne pour le projet VLAN

# Domaine interne
domain-name entreprise.local

# Enregistrements A (nom → IP)
# VLAN10
set service dns forwarding name-server 192.168.10.1   # DNS interne, peut être VyOS
set service dns forwarding listen-address 192.168.10.1
set service dns forwarding allow-from 192.168.10.0/24

# Machines et serveur
# IP statique ou DHCP réservé
srv1   192.168.10.50
pc1    192.168.10.100
pc2    192.168.20.100
pc3    192.168.30.100

# DNS externe (optionnel pour résolution internet)
set service dns forwarding name-server 8.8.8.8
set service dns forwarding name-server 8.8.4.4
