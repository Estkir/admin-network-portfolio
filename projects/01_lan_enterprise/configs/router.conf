# VyOS Router configuration

# Interfaces VLANs
set interfaces ethernet eth0 address 192.168.99.1/24  # management or trunk
set interfaces ethernet eth0 vif 10 address 192.168.10.1/24
set interfaces ethernet eth0 vif 20 address 192.168.20.1/24
set interfaces ethernet eth0 vif 30 address 192.168.30.1/24

# Enable routing (optional if you want PCs to reach outside)
set protocols static route 0.0.0.0/0 next-hop 192.168.99.254
